name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "tests/**"
      - "web/**"
      - "requirements.txt"
      - "pytest.ini"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "app/**"
      - "tests/**"
      - "web/**"
      - "requirements.txt"
      - "pytest.ini"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  COVERAGE_FAIL_UNDER: ${{ vars.QUARK_STRM_COVERAGE_FAIL_UNDER || '66' }}

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Prepare runtime directories
        run: |
          mkdir -p logs strm
          touch quark_strm.db
          cp config.example.yaml config.yaml || true

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=${{ env.COVERAGE_FAIL_UNDER }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-coverage
          path: coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run oxlint
        working-directory: web
        run: npm run lint:oxlint

      - name: Run ESLint
        working-directory: web
        run: npm run lint:eslint

      - name: TypeScript type check
        working-directory: web
        run: npm run type-check

      - name: Run smoke tests
        working-directory: web
        run: npm run test:smoke -- --reporter=dot
