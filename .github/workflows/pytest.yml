name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quark_strm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize quark_strm source
        env:
          QUARK_STRM_REPO_TOKEN: ${{ secrets.QUARK_STRM_REPO_TOKEN }}
        run: |
          SUB_SHA="$(git ls-tree HEAD quark_strm | awk '{print $3}')"
          echo "quark_strm gitlink sha: ${SUB_SHA}"
          CLONE_URL="https://x-access-token:${{ github.token }}@github.com/242282218/quark_strm.git"
          if [ -n "${QUARK_STRM_REPO_TOKEN}" ]; then
            CLONE_URL="https://x-access-token:${QUARK_STRM_REPO_TOKEN}@github.com/242282218/quark_strm.git"
          fi
          git clone "${CLONE_URL}" quark_strm
          git -C quark_strm checkout "${SUB_SHA}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: quark_strm/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Create runtime directories
        run: |
          mkdir -p logs strm
          touch quark_strm.db

      - name: Copy example config
        run: |
          cp config.example.yaml config.yaml || true

      - name: Run Tests
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
        continue-on-error: true

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: quark_strm/logs/
          if-no-files-found: warn
