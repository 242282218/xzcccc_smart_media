name: quark_strm Docker Deploy Test

on:
  workflow_dispatch:
  push:
    paths:
      - "quark_strm/**"
      - ".github/workflows/quark_strm-docker.yml"
  pull_request:
    paths:
      - "quark_strm/**"
      - ".github/workflows/quark_strm-docker.yml"

jobs:
  docker-deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize quark_strm source
        env:
          QUARK_STRM_REPO_TOKEN: ${{ secrets.QUARK_STRM_REPO_TOKEN }}
        run: |
          SUB_SHA="$(git ls-tree HEAD quark_strm | awk '{print $3}')"
          echo "quark_strm gitlink sha: ${SUB_SHA}"
          CLONE_URL="https://x-access-token:${{ github.token }}@github.com/242282218/quark_strm.git"
          if [ -n "${QUARK_STRM_REPO_TOKEN}" ]; then
            CLONE_URL="https://x-access-token:${QUARK_STRM_REPO_TOKEN}@github.com/242282218/quark_strm.git"
          else
            echo "QUARK_STRM_REPO_TOKEN is not set; using default github.token."
          fi

          if ! git clone "${CLONE_URL}" quark_strm; then
            echo "Failed to clone 242282218/quark_strm."
            echo "Set repository secret QUARK_STRM_REPO_TOKEN with read access to that repo."
            exit 1
          fi
          git -C quark_strm checkout "${SUB_SHA}"

      - name: Prepare runtime files
        working-directory: quark_strm
        run: |
          cp config.example.yaml config.yaml
          mkdir -p logs strm
          touch quark_strm.db

      - name: Validate compose file
        working-directory: quark_strm
        run: docker compose config -q

      - name: Build docker image
        working-directory: quark_strm
        run: docker compose build

      - name: Start services
        working-directory: quark_strm
        run: docker compose up -d

      - name: Wait for health endpoint
        working-directory: quark_strm
        run: |
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:8000/health" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after waiting."
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Smoke test root endpoint
        working-directory: quark_strm
        run: curl -fsS "http://127.0.0.1:8000/"

      - name: Capture runtime diagnostics
        if: always()
        working-directory: quark_strm
        run: |
          docker compose ps > compose-ps.txt || true
          docker compose logs --no-color > compose-logs.txt || true

      - name: Upload docker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quark-strm-docker-diagnostics
          path: |
            quark_strm/compose-ps.txt
            quark_strm/compose-logs.txt
            quark_strm/logs
          if-no-files-found: warn

      - name: Stop services
        if: always()
        working-directory: quark_strm
        run: docker compose down -v --remove-orphans || true
